[project]
name = "findex"
version = "0.3.0"
description = "A Python corpus search engine with ranking, crawling, and a web API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"findex.web" = ["templates/*.html", "static/*.css"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: expensive benchmark or network test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
