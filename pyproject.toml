[project]
name = "findex"
version = "1.0.0"
description = "A Python corpus search engine with ranking, crawling, and a web API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13", "httpx>=0.27", "aiofiles>=24", "fastapi>=0.115", "uvicorn>=0.30", "pydantic-settings>=2", "jinja2>=3.1", "numpy>=2.0"]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"findex.web" = ["templates/*.html", "static/*.css"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest-benchmark>=4",
    "matplotlib>=3.11.2",
    "psutil>=6",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: expensive benchmark or network test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
